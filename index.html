<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tonpayom — วิศวกรรมเพื่อการเรียนรู้ ชุมชน และบ้านของทุกคน</title>
<meta name="description" content="แหล่งเรียนรู้งานวิศวกรรมสำหรับนักศึกษา งานจิตอาสาช่วยโรงเรียน วัด ชาวบ้าน และบริการออกแบบ-เขียนแบบบ้าน">
<meta property="og:type" content="website">
<meta property="og:title" content="tonpayom — วิศวกรรมเพื่อการเรียนรู้ ชุมชน และบ้านของทุกคน">
<meta property="og:description" content="แหล่งเรียนรู้งานวิศวกรรมสำหรับนักศึกษา งานจิตอาสาช่วยโรงเรียน วัด ชาวบ้าน และบริการออกแบบ-เขียนแบบบ้าน">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' fill='none' stroke='%2314273F' stroke-width='2.4'%3E%3Crect x='2' y='2' width='32' height='32' rx='6' fill='%23F6F4EF'/%3E%3Cpath d='M8 26 L18 9 L28 26 Z M18 9 V26 M12 20 H24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#14273F; --navy-deep:#0E1D30; --paper:#F6F4EF; --line:#D9D4C7; --field:#C9C3B4;
  --orange:#E8742A; --orange-text:#A84A14; --green:#2F6B4F; --mist:#E7ECF3; --sage:#E3EFE8; --peach:#FBE9DC;
  --ink:#14273F; --body:#3A4556; --muted:#5B6577;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Anuphan,'IBM Plex Sans Thai',sans-serif;margin:0}
img{max-width:100%;display:block}
a{color:var(--navy);transition:color .2s}
a:hover{color:var(--orange-text)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.eyebrow{font-size:15px;font-weight:600;color:var(--orange-text)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:10px;font:inherit;font-size:17px;font-weight:600;text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:transform .2s,background-color .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn-orange{background:var(--orange);color:var(--navy)}
.btn-orange:hover{color:var(--navy)}
.btn-ghost{border-color:#fff;color:#fff}
.btn-ghost:hover{color:#fff;background:rgba(255,255,255,.12)}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{color:#fff}
.btn-line{border-color:var(--navy);color:var(--navy);background:#fff}

/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(246,244,239,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Anuphan,sans-serif;font-size:24px;font-weight:700;letter-spacing:-.5px}
.logo img{height:36px;width:auto}
nav.main{display:flex;gap:28px;font-weight:500}
nav.main a{text-decoration:none;padding:10px 0}
.menu-btn{display:none;width:48px;height:48px;border:1px solid var(--field);border-radius:10px;background:#fff;align-items:center;justify-content:center;cursor:pointer}
.cta-top{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:10px;background:var(--navy);color:#fff;font-weight:600;text-decoration:none}
.cta-top:hover{color:#fff;background:var(--orange-text)}

/* hero */
.hero{background-color:var(--navy);background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px;color:#fff}
.hero .wrap{display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding-top:96px;padding-bottom:120px}
.hero-text{flex:1 1 520px;display:flex;flex-direction:column;gap:24px}
.pill{align-self:flex-start;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 14px;font-size:14px}
.hero h1{font-size:60px;line-height:1.15;font-weight:700;white-space:pre-line}
.hero p{margin:0;font-size:20px;line-height:1.7;color:#D7DEE8;max-width:560px}
.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.hero-art{flex:1 1 420px}
.hero-art img{width:100%;border-radius:16px;aspect-ratio:4/3;object-fit:cover}
.plan{width:100%;height:auto;display:block}

/* three cards */
.pillars{margin-top:-64px;position:relative;z-index:2}
.pillars .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;text-decoration:none;display:flex;flex-direction:column;gap:14px}
.pcard:hover{translate:0 -6px;box-shadow:0 18px 36px rgba(20,39,63,.12)}
.icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.pcard .num{font-size:14px;color:var(--muted);font-weight:600}
.pcard h2{font-size:26px;font-weight:700;color:var(--navy)}
.pcard p{margin:0;color:var(--body);line-height:1.7}
.pcard .more{font-weight:600}

section.block{padding:112px 0 0}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:32px}
.sec-head h2{font-size:42px;line-height:1.25;font-weight:700;margin-top:8px}
.sec-title{font-size:42px;line-height:1.25;font-weight:700}
.sec-title.sm{font-size:36px}

/* knowledge */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--field);border-radius:12px;padding:0 16px;min-height:48px;min-width:min(320px,100%)}
.search input{border:0;outline:0;font:inherit;flex:1;background:transparent;color:var(--ink);min-width:0}
.search:focus-within{outline:3px solid var(--orange);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.chip{min-height:44px;padding:0 18px;border-radius:999px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;background:#fff;color:var(--navy);border:1px solid var(--field);transition:background-color .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.articles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.article{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;padding:0;width:100%}
button.article{cursor:pointer;transition:translate .3s,box-shadow .3s}
button.article:hover{translate:0 -6px;box-shadow:0 18px 36px rgba(20,39,63,.12)}
.thumb{height:140px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(20,39,63,.85);display:flex;align-items:center;justify-content:center}
.article .body{padding:20px;display:flex;flex-direction:column;gap:10px}
.article .tag{font-size:13px;font-weight:600;color:var(--orange-text)}
.article h3{font-size:20px;line-height:1.4;font-weight:600}
.article .kind{font-size:14px;color:var(--muted)}
.soon{font-size:13px;color:var(--muted);font-style:italic}
.empty{grid-column:1/-1;color:var(--muted);padding:24px 0}

/* community */
.community{background:var(--sage);margin-top:112px;padding:96px 0}
.community .wrap{display:flex;flex-wrap:wrap;gap:56px;align-items:flex-start}
.community .left{flex:1 1 440px;display:flex;flex-direction:column;gap:18px}
.community h2{font-size:42px;line-height:1.25;font-weight:700;white-space:pre-line}
.community p{margin:0;font-size:18px;line-height:1.75;color:#2E3B35}
.community .eyebrow{color:var(--green)}
.btn-green{align-self:flex-start;background:var(--green);color:#fff}
.btn-green:hover{color:#fff}
.who{flex:1 1 520px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.who > div{background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:8px}
.who > div:hover{translate:0 -6px;box-shadow:0 18px 36px rgba(20,39,63,.1)}
.who h3{font-size:20px;font-weight:700}
.who span{font-size:15px;line-height:1.65;color:var(--body)}

/* design service */
.lead{margin:0;font-size:18px;line-height:1.75;color:var(--body);max-width:720px}
.steps{list-style:none;margin:40px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.steps li{padding:28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.steps li:last-child{border-right:0}
.steps .n{font-family:Anuphan,sans-serif;font-size:40px;font-weight:700;color:var(--orange)}
.steps b{font-size:19px;font-weight:600}
.steps span{font-size:15px;line-height:1.65;color:var(--body)}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:22px}
.price{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:12px}
.price:hover{translate:0 -6px;box-shadow:0 18px 36px rgba(20,39,63,.12)}
.price.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
.price b{font-size:18px;font-weight:600}
.price .big{font-family:Anuphan,sans-serif;font-size:30px;font-weight:700}
.price .big small{font-family:'IBM Plex Sans Thai',sans-serif;font-size:16px;font-weight:500;color:var(--muted)}
.price.dark .big small{color:#B9C3D1}
.price span{font-size:15px;line-height:1.65;color:var(--body)}
.price.dark span{color:#D7DEE8}

/* portfolio */
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.shot{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line);padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;transition:translate .3s,box-shadow .3s}
.shot:hover{translate:0 -6px;box-shadow:0 18px 36px rgba(20,39,63,.12)}
.shot .ph{height:220px;background:var(--mist);position:relative;display:flex;align-items:center;justify-content:center}
.shot .ph img{width:100%;height:100%;object-fit:cover}
.shot .cap{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.shot b{font-size:17px;font-weight:600}
.shot span{font-size:14px;color:var(--muted)}
.shot-empty{height:200px;border-radius:14px;border:1.5px dashed var(--field);display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px;grid-column:1/-1}

/* contact */
.contact{padding:112px 0}
.contact .wrap{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-start}
.contact .info{flex:1 1 320px;display:flex;flex-direction:column;gap:16px}
.contact h2{font-size:38px;line-height:1.25;font-weight:700}
.contact ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;color:var(--body);font-size:15px}
.channels{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.channel{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-decoration:none;min-height:52px}
.channel .ci{width:32px;height:32px;border-radius:8px;background:var(--mist);display:flex;align-items:center;justify-content:center;flex:none}
.channel small{display:block;font-size:13px;color:var(--muted)}
.channel b{font-weight:600;word-break:break-all}
.formcard{flex:1 1 560px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:36px;display:flex;flex-direction:column;gap:26px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
legend{font-weight:600;padding:0;margin-bottom:4px}
.opt{text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-radius:12px;padding:16px 18px;min-height:44px;display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--field)}
.opt[aria-pressed="true"]{background:var(--mist);border:2px solid var(--navy);padding:15px 17px}
.opt b{font-size:17px;font-weight:600}
.opt span{font-size:14px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
label{display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600}
input[type=text],textarea{min-height:48px;padding:0 14px;border:1px solid var(--field);border-radius:10px;font:inherit;font-weight:400;color:var(--ink);background:#fff;width:100%}
textarea{padding:12px 14px;resize:vertical}
.result{display:none;flex-direction:column;gap:16px;background:var(--sage);border-radius:14px;padding:24px}
.result.show{display:flex}
.result.error{background:var(--peach)}
.result pre{margin:0;white-space:pre-wrap;font:inherit;font-size:15px;line-height:1.7;background:#fff;border-radius:10px;padding:16px;color:var(--ink)}
.result .acts{display:flex;flex-wrap:wrap;gap:12px}
.note{font-size:14px;color:var(--body);margin:0}

footer{background:var(--navy-deep);color:#C8D1DD}
footer .wrap{display:flex;flex-wrap:wrap;gap:40px;justify-content:space-between;padding-top:56px;padding-bottom:56px}
footer .brand{font-family:Anuphan,sans-serif;font-size:24px;font-weight:700;color:#fff}
footer p{margin:8px 0 0;max-width:360px;line-height:1.7}
footer .col{display:flex;flex-direction:column;gap:8px;font-size:15px}
footer .col b{color:#fff}
footer a{color:#C8D1DD}
footer a:hover{color:#fff}

/* viewer (article / portfolio) */
dialog.viewer{border:0;padding:0;border-radius:18px;width:min(820px,calc(100% - 32px));max-height:calc(100% - 48px);background:#fff;color:var(--ink);box-shadow:0 30px 80px rgba(14,29,48,.35)}
dialog.viewer::backdrop{background:rgba(14,29,48,.6)}
.viewer .vhead{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 24px 14px;border-bottom:1px solid var(--line);z-index:1}
.viewer .vhead h2{font-size:26px;line-height:1.35}
.viewer .vclose{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--field);background:#fff;cursor:pointer;font-size:22px;line-height:1;color:var(--navy)}
.viewer .vbody{padding:22px 24px 28px;display:flex;flex-direction:column;gap:18px}
.viewer .meta{font-size:14px;font-weight:600;color:var(--orange-text)}
.viewer .vimg{border-radius:12px;width:100%;height:auto}
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.prose{font-size:17px;line-height:1.8;color:var(--body)}
.prose h2,.prose h3{color:var(--ink);margin:1.2em 0 .4em;font-size:22px}
.prose img{border-radius:10px;margin:12px 0}
.prose a{color:var(--orange-text)}
.prose > :first-child{margin-top:0}

/* loading / error */
.loading{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--muted)}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(48px);transition:opacity .8s cubic-bezier(.2,.7,.2,1) var(--d,0ms),transform .8s cubic-bezier(.2,.7,.2,1) var(--d,0ms),translate .3s,box-shadow .3s}
.reveal.in{opacity:1;transform:none}

@media (max-width:900px){
  .wrap{padding:0 20px}
  nav.main{display:none;position:absolute;left:0;right:0;top:72px;background:var(--paper);border-bottom:1px solid var(--line);flex-direction:column;gap:0;padding:8px 20px 16px}
  nav.main.open{display:flex}
  nav.main a{padding:14px 0;border-bottom:1px solid var(--line);font-size:17px}
  .menu-btn{display:flex}
  .cta-top{display:none}
  .hero h1{font-size:38px}
  .hero p{font-size:17px}
  .hero .wrap{padding-top:56px;padding-bottom:96px}
  .sec-head h2,.community h2,.sec-title{font-size:32px}
  .sec-title.sm{font-size:30px}
  section.block{padding-top:80px}
  .community{margin-top:80px;padding:64px 0}
  .who{grid-template-columns:1fr}
  .steps li{border-right:0;border-bottom:1px solid var(--line)}
  .steps li:last-child{border-bottom:0}
  .formcard{padding:24px}
  .contact{padding:80px 0}
  .viewer .vhead,.viewer .vbody{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  .btn:hover,.pcard:hover,button.article:hover,.price:hover,.who > div:hover,.shot:hover{transform:none;translate:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" id="logo"></a>
    <nav class="main" id="nav" aria-label="เมนูหลัก"></nav>
    <a class="cta-top" href="#contact" id="ctaTop"></a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="nav">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14273F" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<main id="top">
  <div class="loading" id="loading">กำลังโหลด…</div>
</main>

<footer id="footer"></footer>

<dialog class="viewer" id="viewer" aria-labelledby="vTitle">
  <div class="vhead"><h2 id="vTitle"></h2><button type="button" class="vclose" id="vClose" aria-label="ปิด">×</button></div>
  <div class="vbody" id="vBody"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- helpers ---------- */
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function arr(a){ return Array.isArray(a) ? a : []; }
  function obj(o){ return o && typeof o === 'object' ? o : {}; }
  // CMS may save "/images/uploads/x.jpg"; the site lives under a sub-path, so make it relative.
  function src(p){
    p = String(p || '').trim();
    if(!p) return '';
    if(/^(https?:)?\/\//i.test(p) || /^data:/i.test(p)) return p;
    return p.replace(/^\/+/, '');
  }
  function safeUrl(u){
    u = String(u || '').trim();
    return /^(https?:|mailto:|tel:)/i.test(u) ? u : (u && !/^[a-z]+:/i.test(u) ? u : '');
  }
  function youtubeId(u){
    u = String(u || '').trim();
    if(!u) return '';
    var m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/i);
    if(m) return m[1];
    return /^[\w-]{11}$/.test(u) ? u : '';
  }
  function ytEmbed(id){
    return '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" title="วิดีโอ" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
  }
  function ytThumb(id){ return 'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg'; }
  function md(text){
    text = String(text || '');
    if(!text.trim()) return '';
    if(window.marked && window.DOMPurify){
      return DOMPurify.sanitize(marked.parse(text), {ADD_ATTR:['target']});
    }
    return '<p>'+esc(text).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>')+'</p>';
  }
  var PLAY = '<span class="play" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span>';

    if(c.type === 'email') return 'mailto:'+v;
    if(c.type === 'line') return v.charAt(0) === '@' ? 'https://line.me/R/ti/p/@'+encodeURIComponent(v.slice(1)) : 'https://line.me/ti/p/~'+encodeURIComponent(v);

      '<form class="formcard reveal" id="form" novalidate><fieldset><legend>ต้องการบริการแบบไหน</legend>' +
      services.map(function(s,i){
        return '<button type="button" class="opt" data-idx="'+i+'" aria-pressed="'+(i===serviceIdx)+'"><b>'+esc(s.title)+'</b>'+(s.text?'<span>'+esc(s.text)+'</span>':'')+'</button>';
      }).join('') + '</fieldset>' +
      '<div class="row"><label>ชื่อ-นามสกุล / ชื่อหน่วยงาน<input type="text" id="f-name" placeholder="เช่น โรงเรียนบ้านหนองแสง" autocomplete="name"></label>' +
      '<label>เบอร์โทร หรือ LINE ID<input type="text" id="f-contact" placeholder="08x-xxx-xxxx" autocomplete="tel"></label></div>' +
      '<label>จังหวัด / ที่ตั้งของงาน<input type="text" id="f-place" placeholder="เช่น อ.เมือง จ.ขอนแก่น"></label>' +
      '<label>เล่าให้ฟังสั้นๆ ว่าต้องการอะไร<textarea id="f-detail" rows="5" placeholder="เช่น ศาลาวัดหลังคารั่ว / อยากสร้างบ้าน 2 ชั้น พื้นที่ดิน 100 ตร.ว."></textarea></label>' +

  function setMeta(name, val, prop){
    if(!val) return;
    var sel = prop ? 'meta[property="'+name+'"]' : 'meta[name="'+name+'"]';
    var m = document.querySelector(sel);
    if(!m){ m = document.createElement('meta'); m.setAttribute(prop?'property':'name', name); document.head.appendChild(m); }
    m.setAttribute('content', val);
  }

  /* ---------- knowledge ---------- */
  function articleList(){ return arr(obj(S.knowledge).articles); }
  function hasDetail(a){ return !!(String(a.body||'').trim() || youtubeId(a.video) || a.file || a.image); }
  function initKnowledge(kn){
    var cats = ['ทั้งหมด'].concat(arr(kn.categories));
    cat = 'ทั้งหมด'; term = '';
    $('chips').innerHTML = cats.map(function(c){
      return '<button type="button" class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'</button>';
    }).join('');
    $('chips').addEventListener('click',function(e){
      var b = e.target.closest('.chip'); if(!b) return;
      cat = b.getAttribute('data-cat');
      [].forEach.call($('chips').children,function(c){ c.setAttribute('aria-pressed', String(c===b)); });
      drawList();
    });
    $('q').addEventListener('input',function(){ term = this.value; drawList(); });
    $('articles').addEventListener('click',function(e){
      var b = e.target.closest('[data-article]'); if(!b) return;
      openArticle(articleList()[+b.getAttribute('data-article')]);
    });
    drawList();
  }
  function drawList(){
    var cats = arr(obj(S.knowledge).categories);
    var t = term.trim().toLowerCase();
    var rows = [];
    articleList().forEach(function(a,i){
      if((cat==='ทั้งหมด'||a.category===cat) && (!t || [a.title,a.category,a.kind,a.level].join(' ').toLowerCase().indexOf(t)>-1)) rows.push([a,i]);
    });
    $('articleCount').textContent = 'พบ '+rows.length+' รายการ';
    if(!rows.length){ $('articles').innerHTML = '<p class="empty">ไม่พบบทความที่ตรงกับคำค้น ลองใช้คำอื่นหรือเปลี่ยนหมวด</p>'; return; }
    $('articles').innerHTML = rows.map(function(r){
      var a = r[0], i = r[1], yid = youtubeId(a.video), open = hasDetail(a);
      var tone = TONES[Math.max(0, cats.indexOf(a.category)) % TONES.length];
      var cover = a.image ? src(a.image) : (yid ? ytThumb(yid) : '');
      var thumb = '<div class="thumb" style="background:'+tone+'">' + (cover ? '<img src="'+esc(cover)+'" alt="" loading="lazy">' :
        '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#14273F" stroke-width="1.5" aria-hidden="true"><path d="M3 21V3h18v18z"/><path d="M3 12h9V3"/><path d="M12 12v9"/></svg>') + (yid ? PLAY : '') + '</div>';
      var body = '<div class="body"><span class="tag">'+esc(a.category)+(a.level?' · '+esc(a.level):'')+'</span><h3>'+esc(a.title)+'</h3><span class="kind">'+esc(a.kind)+'</span>'+(open?'':'<span class="soon">เนื้อหากำลังจะมาเร็วๆ นี้</span>')+'</div>';
      return open ? '<button type="button" class="article" data-article="'+i+'">'+thumb+body+'</button>' : '<article class="article">'+thumb+body+'</article>';
    }).join('');
  }

  /* ---------- viewer ---------- */
  var viewer = $('viewer');
  function openViewer(title, html){
    $('vTitle').textContent = title || '';
    $('vBody').innerHTML = html;
    [].forEach.call($('vBody').querySelectorAll('.prose a[href^="http"]'),function(a){ a.target='_blank'; a.rel='noopener'; });
    if(viewer.showModal) viewer.showModal(); else viewer.setAttribute('open','');
    $('vBody').scrollTop = 0; viewer.scrollTop = 0;
  }
  function closeViewer(){ $('vBody').innerHTML = ''; if(viewer.close) viewer.close(); else viewer.removeAttribute('open'); }
  $('vClose').addEventListener('click', closeViewer);
  viewer.addEventListener('click',function(e){ if(e.target === viewer) closeViewer(); });
  // Esc closes the dialog natively; clear it so a playing video stops (unless it was reopened meanwhile).
  viewer.addEventListener('close',function(){ if(!viewer.open) $('vBody').innerHTML = ''; });

  function openArticle(a){
    if(!a) return;
    var yid = youtubeId(a.video), h = '';
    h += '<span class="meta">'+esc(a.category)+(a.level?' · '+esc(a.level):'')+(a.kind?' · '+esc(a.kind):'')+'</span>';
    if(yid) h += ytEmbed(yid);
    else if(a.image) h += '<img class="vimg" src="'+esc(src(a.image))+'" alt="">';
    if(String(a.body||'').trim()) h += '<div class="prose">'+md(a.body)+'</div>';
    if(a.file) h += '<a class="btn btn-navy" style="align-self:flex-start" href="'+esc(src(a.file))+'" target="_blank" rel="noopener" download>ดาวน์โหลดไฟล์ประกอบ</a>';
    openViewer(a.title, h);
  }
  document.addEventListener('click',function(e){
    var b = e.target.closest('[data-shot]'); if(!b) return;
    var it = arr(obj(S.portfolio).items)[+b.getAttribute('data-shot')]; if(!it) return;
    var yid = youtubeId(it.video), h = '';
    if(it.place) h += '<span class="meta">'+esc(it.place)+'</span>';
    if(yid) h += ytEmbed(yid);
    arr(it.images).forEach(function(x){ var p = typeof x === 'string' ? x : obj(x).image; if(p) h += '<img class="vimg" src="'+esc(src(p))+'" alt="" loading="lazy">'; });
    if(String(it.text||'').trim()) h += '<div class="prose">'+md(it.text)+'</div>';
    openViewer(it.title, h);
  });

  /* ---------- form ---------- */
  function initForm(ct){
    var services = arr(ct.services);
    var opts = [].slice.call(document.querySelectorAll('.opt'));
    function setService(i){
      serviceIdx = i;
      opts.forEach(function(o){ o.setAttribute('aria-pressed', String(+o.getAttribute('data-idx')===i)); });
    }
    opts.forEach(function(o){ o.addEventListener('click',function(){ setService(+o.getAttribute('data-idx')); }); });
    [].forEach.call(document.querySelectorAll('[data-pick]'),function(a){
      a.addEventListener('click',function(){
        var key = a.getAttribute('data-pick');
        for(var i=0;i<services.length;i++){ if(services[i].from === key){ setService(i); break; } }
      });
    });

    var form = $('form'), result = $('result'), msg = $('msg'), title = $('resultTitle'), note = $('resultNote');
    var mail = $('mailLink'), copy = $('copyBtn');
    var to = String(ct.form_email || '').trim();
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var name = $('f-name').value.trim(), contact = $('f-contact').value.trim(),
          place = $('f-place').value.trim(), detail = $('f-detail').value.trim();
      if(!name || !contact){
        (name ? $('f-contact') : $('f-name')).focus();
        title.textContent = 'ยังกรอกข้อมูลไม่ครบ';
        msg.textContent = 'กรุณากรอกชื่อและเบอร์โทร/LINE ID เพื่อให้ติดต่อกลับได้';
        result.classList.add('show','error'); mail.style.display='none'; copy.style.display='none'; note.style.display='none';
        return;
      }
      var svc = obj(services[serviceIdx]).title || '-';
      title.textContent = 'ข้อความของคุณพร้อมแล้ว — เลือกวิธีส่ง';
      result.classList.remove('error');
      mail.style.display = to ? '' : 'none'; copy.style.display = ''; note.style.display = '';
      formText = 'บริการที่ต้องการ: '+svc+'\nชื่อ/หน่วยงาน: '+name+'\nติดต่อกลับ: '+contact+'\nที่ตั้งงาน: '+(place||'-')+'\nรายละเอียด: '+(detail||'-');
      msg.textContent = formText;
      if(to) mail.href = 'mailto:'+to+'?subject='+encodeURIComponent('ขอรับบริการ '+(obj(S.brand).name||'')+' — '+svc)+'&body='+encodeURIComponent(formText);
      result.classList.add('show');
      result.scrollIntoView({behavior:'smooth',block:'nearest'});
    });
    copy.addEventListener('click',function(){
      var done = function(ok){ copy.textContent = ok ? 'คัดลอกแล้ว ✓' : 'คัดลอกไม่ได้ ลองเลือกข้อความแล้วคัดลอกเอง'; setTimeout(function(){ copy.textContent='คัดลอกข้อความ'; },2500); };
      try{ navigator.clipboard.writeText(formText).then(function(){done(true);},function(){done(false);}); }catch(err){ done(false); }
    });
  }

  /* ---------- reveal ---------- */
  function initReveal(){
    var items = [].slice.call(document.querySelectorAll('.reveal'));
    if(!('IntersectionObserver' in window)){ items.forEach(function(el){ el.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }});
    },{threshold:0.12,rootMargin:'0px 0px -6% 0px'});
    items.forEach(function(el,i){ el.style.setProperty('--d',((i%3)*90)+'ms'); io.observe(el); });
  }

  /* ---------- menu ---------- */
  var nav = $('nav'), btn = $('menuBtn');
  btn.addEventListener('click',function(){
    var open = nav.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  nav.addEventListener('click',function(e){ if(e.target.tagName==='A'){ nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }});
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && nav.classList.contains('open')){ nav.classList.remove('open'); btn.setAttribute('aria-expanded','false'); btn.focus(); }});

  /* ---------- load ---------- */
  fetch('content/site.json', {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function(err){
      $('loading').innerHTML = 'โหลดข้อมูลเว็บไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง';
      if(window.console) console.error('site.json', err);
    });
})();
</script>
</body>
</html>
